<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="ashSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0a0e"/>
      <stop offset="55%" stop-color="#1f1619"/>
      <stop offset="100%" stop-color="#2e1a12"/>
    </linearGradient>
    <radialGradient id="forgeCore" cx="50%" cy="62%" r="45%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0b0a0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#ashSky)"/>
  <rect width="1200" height="900" fill="url(#forgeCore)"/>

  <!-- Colossal Clockwork Bastion Gear Ring -->
  <circle cx="600" cy="490" r="240" fill="none" stroke="#f59e0b" stroke-width="14" stroke-opacity="0.18" stroke-dasharray="28 18"/>
  <circle cx="600" cy="490" r="195" fill="none" stroke="#ea580c" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Fortress Towers -->
  <rect x="260" y="280" width="110" height="460" fill="#121116" stroke="#f59e0b" stroke-opacity="0.2"/>
  <rect x="830" y="280" width="110" height="460" fill="#121116" stroke="#f59e0b" stroke-opacity="0.2"/>
  <rect x="460" y="210" width="280" height="530" fill="#0d0c10" stroke="#f59e0b" stroke-opacity="0.3"/>

  <!-- Glowing Furnace Slits -->
  <rect x="520" y="340" width="24" height="160" fill="#f97316" opacity="0.85"/>
  <rect x="588" y="310" width="24" height="190" fill="#fbbf24" opacity="0.9"/>
  <rect x="656" y="340" width="24" height="160" fill="#f97316" opacity="0.85"/>

  <!-- Fortified Viaduct Bridge -->
  <rect x="0" y="640" width="1200" height="55" fill="#09090c"/>
  <path d="M80,900 L80,695 Q180,650 280,695 L280,900 Z" fill="#141218"/>
  <path d="M460,900 L460,695 Q600,640 740,695 L740,900 Z" fill="#141218"/>
  <path d="M920,900 L920,695 Q1020,650 1120,695 L1120,900 Z" fill="#141218"/>
</svg>
