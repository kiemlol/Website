<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070b"/>
      <stop offset="55%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#171923"/>
    </linearGradient>
    <radialGradient id="planetGlow" cx="65%" cy="42%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#05070b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planetBody" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="28%" stop-color="#0284c7"/>
      <stop offset="65%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="deckAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#spaceBg)"/>
  <rect width="1200" height="900" fill="url(#planetGlow)"/>

  <!-- Starfield -->
  <g fill="#e2e8f0" opacity="0.6">
    <circle cx="180" cy="140" r="1.2"/>
    <circle cx="340" cy="95" r="1.5"/>
    <circle cx="520" cy="180" r="1"/>
    <circle cx="890" cy="110" r="1.8"/>
    <circle cx="1050" cy="210" r="1.2"/>
    <circle cx="260" cy="310" r="1.4"/>
    <circle cx="980" cy="390" r="1"/>
  </g>

  <!-- Ringed Gas Giant Planet -->
  <g transform="translate(760, 370)">
    <ellipse cx="0" cy="0" rx="340" ry="68" fill="none" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.22" transform="rotate(-16)"/>
    <ellipse cx="0" cy="0" rx="295" ry="56" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.4" transform="rotate(-16)"/>
    <circle cx="0" cy="0" r="155" fill="url(#planetBody)"/>
    <ellipse cx="0" cy="0" rx="320" ry="62" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-opacity="0.45" stroke-dasharray="480 480" transform="rotate(-16)"/>
  </g>

  <!-- Orbital Station Hangar Structural Frame -->
  <polygon points="0,0 1200,0 1200,130 980,180 220,180 0,130" fill="#090b10"/>
  <polygon points="0,900 1200,900 1200,660 960,600 240,600 0,660" fill="#090b10"/>
  <polygon points="0,120 150,175 150,605 0,665" fill="#0b0e15"/>
  <polygon points="1200,120 1050,175 1050,605 1200,665" fill="#0b0e15"/>

  <!-- Structural Truss Struts -->
  <line x1="380" y1="180" x2="310" y2="600" stroke="#1e293b" stroke-width="10"/>
  <line x1="820" y1="180" x2="890" y2="600" stroke="#1e293b" stroke-width="10"/>

  <!-- Hangar Deck Floor Perspective Grid & Amber Runway Lights -->
  <polygon points="240,600 960,600 1150,900 50,900" fill="#0f131c"/>
  <line x1="600" y1="600" x2="600" y2="900" stroke="#f59e0b" stroke-width="3" stroke-dasharray="18 14" stroke-opacity="0.7"/>
  <rect x="280" y="625" width="640" height="4" fill="url(#deckAmber)"/>
  <rect x="200" y="720" width="800" height="4" fill="url(#deckAmber)"/>

  <!-- Dropship / Interceptor Silhouette Parked on Deck -->
  <g transform="translate(410, 495)">
    <polygon points="190,0 265,55 350,82 310,115 70,115 30,82 115,55" fill="#111827" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <polygon points="165,30 215,30 230,68 150,68" fill="#0284c7" fill-opacity="0.45"/>
    <!-- Thruster Glow -->
    <rect x="125" y="95" width="38" height="10" rx="4" fill="#f59e0b"/>
    <rect x="217" y="95" width="38" height="10" rx="4" fill="#f59e0b"/>
  </g>
</svg>
